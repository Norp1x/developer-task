server:
  port: ${PORT_NUMBER:8080}

management:
  endpoints:
    web:
      exposure:
        include: "health, info"
  health:
    db:
      enabled: true
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    org.hibernate: WARN
    com.microsoft.sqlserver: WARN
    org.flywaydb.core: DEBUG
    liquibase: DEBUG