spring:
  application:
    name: 'search-service'
  config:
    import: classpath:SearchServiceConfig.yml
  security:
    user:
      name: Norpix
      password: sa123

  h2:
    console:
      enabled: true
      path: ${H2_PATH:/h2}
      settings:
        web-allow-others: true

  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=search-serv;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:Norpix}
    password: ${DB_PASSWORD:sa123}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  flyway:
    enabled: false
    locations: classpath:db/migration
  liquibase:
    enabled: true
    change-log: db/changelog/changelog-master.yaml

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: update

